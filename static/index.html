<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDPR Assistant</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', 'SF Pro', monospace; background: #1a1a2e; height: 100vh; display: flex; flex-direction: column; color: #e0e0e0; }
header { background: linear-gradient(135deg, #2d1b69, #1a1a2e); color: #c4b5fd; padding: 16px 24px; font-size: 18px; font-weight: 600; border-bottom: 1px solid #7c3aed33; letter-spacing: 1px; }
#chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
.user { align-self: flex-end; background: linear-gradient(135deg, #7c3aed, #5b21b6); color: #f5f3ff; border-bottom-right-radius: 4px; box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3); }
.bot { align-self: flex-start; background: #2a2a40; color: #e2e0f0; border-bottom-left-radius: 4px; border: 1px solid #7c3aed22; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.bot.risk-card { max-width: 90%; white-space: normal; }
.sources { font-size: 12px; color: #a78bfa; margin-top: 8px; border-top: 1px solid #7c3aed33; padding-top: 8px; }
#input-area { padding: 16px 24px; background: #16162a; border-top: 1px solid #7c3aed33; display: flex; gap: 12px; }
#input { flex: 1; padding: 12px 16px; border: 1px solid #7c3aed44; border-radius: 24px; font-size: 14px; outline: none; background: #1e1e36; color: #e0e0e0; }
#input:focus { border-color: #7c3aed; box-shadow: 0 0 8px rgba(124, 58, 237, 0.4); }
#input::placeholder { color: #6b6b8a; }
#send { background: linear-gradient(135deg, #7c3aed, #5b21b6); color: white; border: none; border-radius: 24px; padding: 12px 24px; font-size: 14px; cursor: pointer; transition: all 0.2s; }
#send:hover { box-shadow: 0 0 12px rgba(124, 58, 237, 0.6); }
#send:disabled { background: #3a3a5c; cursor: not-allowed; box-shadow: none; }
.typing { align-self: flex-start; color: #a78bfa; font-style: italic; font-size: 14px; }
#chat::-webkit-scrollbar { width: 6px; }
#chat::-webkit-scrollbar-track { background: #1a1a2e; }
#chat::-webkit-scrollbar-thumb { background: #7c3aed44; border-radius: 3px; }

/* Risk Dashboard Styles */
.risk-dashboard { display: flex; flex-direction: column; gap: 12px; }
.risk-overall { text-align: center; padding: 12px; background: #1a1a2e; border-radius: 8px; }
.risk-overall .score { font-size: 36px; font-weight: bold; }
.risk-dimensions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dim-item { background: #1a1a2e; padding: 8px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
.dim-item .label { font-size: 12px; color: #a78bfa; }
.dim-item .dim-score { font-size: 14px; font-weight: bold; }
.dim-item { cursor: pointer; transition: background 0.2s; }
.dim-item:hover { background: #252540; }
.dim-detail { font-size: 11px; color: #ccc; margin-top: 6px; display: none; line-height: 1.4; }
.dim-item.expanded .dim-detail { display: block; }
.dim-item.expanded { grid-column: 1 / -1; }
.risk-bar { height: 4px; background: #333; border-radius: 2px; margin-top: 4px; overflow: hidden; }
.risk-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
.risk-list { margin-top: 8px; }
.risk-item { background: #1a1a2e; padding: 10px; border-radius: 6px; margin-bottom: 6px; border-left: 3px solid; }
.risk-item.High { border-color: #ef4444; }
.risk-item.Medium { border-color: #f59e0b; }
.risk-item.Low { border-color: #10b981; }
.risk-item .risk-title { font-weight: 600; font-size: 13px; }
.risk-item .risk-desc { font-size: 12px; color: #aaa; margin-top: 4px; }
.risk-item .risk-rec { font-size: 11px; color: #a78bfa; margin-top: 4px; font-style: italic; }
.priorities { margin-top: 8px; padding: 8px 12px; background: #1a1a2e; border-radius: 6px; }
.priorities .pri-title { font-size: 12px; color: #a78bfa; margin-bottom: 4px; }
.priorities li { font-size: 12px; margin-left: 16px; margin-bottom: 2px; }
</style>
</head>
<body>
<header>⚡ GDPR Compliance Assistant</header>
<div id="chat">
  <div class="msg bot">Hi! I'm your GDPR compliance assistant. Ask me anything about GDPR, or type <b>/risk</b> followed by your project description to get a multi-dimensional risk assessment with scores.</div>
</div>
<div id="input-area">
  <input id="input" placeholder="Ask about GDPR or type /risk [project description]..." autocomplete="off">
  <button id="send">Send</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');
let history = [];

function scoreColor(score) {
  if (score <= 3) return '#10b981';
  if (score <= 6) return '#f59e0b';
  return '#ef4444';
}

function addMsg(text, cls, sourcesHtml) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  if (sourcesHtml) {
    const s = document.createElement('div');
    s.className = 'sources';
    s.innerHTML = sourcesHtml;
    div.appendChild(s);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addRiskDashboard(analysis, sources) {
  const div = document.createElement('div');
  div.className = 'msg bot risk-card';

  const dimLabels = {
    lawful_basis: '⚖️ Lawful Basis',
    data_minimization: '📉 Data Minimization',
    consent_transparency: '✅ Consent & Transparency',
    data_subject_rights: '👤 Data Subject Rights',
    international_transfers: '🌍 International Transfers',
    security_breach: '🔒 Security & Breach',
    special_categories: '🏥 Special Categories',
    automated_decisions: '🤖 Automated Decisions'
  };

  let html = '<div class="risk-dashboard">';

  // Overall score
  html += `<div class="risk-overall">
    <div style="font-size:12px;color:#a78bfa;">OVERALL RISK SCORE</div>
    <div class="score" style="color:${scoreColor(analysis.overall_score)}">${analysis.overall_score}/10</div>
  </div>`;

  // Dimensions grid
  html += '<div class="risk-dimensions">';
  for (const [key, val] of Object.entries(analysis.dimensions || {})) {
    const label = dimLabels[key] || key;
    const color = scoreColor(val.score);
    html += `<div class="dim-item" onclick="this.classList.toggle('expanded')">
      <div style="flex:1"><div class="label">${label}</div>
        <div class="risk-bar"><div class="risk-bar-fill" style="width:${val.score*10}%;background:${color}"></div></div>
        <div class="dim-detail">${val.summary}</div>
      </div>
      <div class="dim-score" style="color:${color}">${val.score}</div>
    </div>`;
  }
  html += '</div>';

  // Risk list
  if (analysis.risks?.length) {
    html += '<div class="risk-list">';
    for (const r of analysis.risks) {
      html += `<div class="risk-item ${r.level}">
        <div class="risk-title">[${r.level}] ${r.title}</div>
        <div class="risk-desc">${r.description} — <em>${r.article}</em></div>
        <div class="risk-rec">💡 ${r.recommendation}</div>
      </div>`;
    }
    html += '</div>';
  }

  // Top priorities
  if (analysis.top_priorities?.length) {
    html += '<div class="priorities"><div class="pri-title">🎯 Top Priorities</div><ol>';
    for (const p of analysis.top_priorities) {
      html += `<li>${p}</li>`;
    }
    html += '</ol></div>';
  }

  html += '</div>';

  // Sources
  if (sources?.length) {
    html += '<div class="sources">📚 Sources:<br>';
    html += sources.map(s => `📄 ${s.source} (chunk ${s.chunk_index})`).join('<br>');
    html += '</div>';
  }

  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMsg() {
  const q = input.value.trim();
  if (!q) return;
  addMsg(q, 'user');
  input.value = '';
  send.disabled = true;

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = '⟳ Processing...';
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  try {
    const isRisk = q.startsWith('/risk ');
    let res;

    if (isRisk) {
      const desc = q.slice(6);
      res = await fetch('/risk', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({project_description: desc})
      });
      const data = await res.json();
      typing.remove();
      addRiskDashboard(data.analysis, data.sources);
    } else {
      res = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: q, history: history})
      });
      const data = await res.json();
      typing.remove();

      history.push({role: 'user', content: q});
      history.push({role: 'assistant', content: data.answer});
      if (history.length > 10) history = history.slice(-10);

      const sources = data.sources?.map(s => `📄 ${s.source} (chunk ${s.chunk_index})`).join('<br>') || '';
      addMsg(data.answer, 'bot', sources ? '📚 Sources:<br>' + sources : '');
    }
  } catch (e) {
    typing.remove();
    addMsg('Sorry, something went wrong. Please try again.', 'bot');
  }
  send.disabled = false;
  input.focus();
}

send.addEventListener('click', sendMsg);
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
input.focus();
</script>
</body>
</html>
